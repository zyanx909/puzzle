<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rang Sort – Puzzle</title>
<style>
:root{--bg:#0f0b1d;--panel:#191230;--line:#2e2352;--tx:#f3eefe;--mut:#a79bc9;--a:#a98bff;--g:#6ee7a0}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{background:radial-gradient(800px 500px at 80% -10%,#2a1a5e,transparent),var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.tube:focus-visible{outline:2px solid var(--a);outline-offset:3px}
.wrap{max-width:760px;margin:auto;padding:20px 14px 40px;text-align:center}
h1{font-size:28px}h1 span{color:var(--a)}
.sub{color:var(--mut);margin:2px 0 14px;font-size:14px}
.bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 16px;font-weight:600}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 16px}
.btn:hover:not(:disabled){border-color:var(--a)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.main{background:var(--a);color:#150c33;border:0;font-weight:700}
#board{display:flex;flex-wrap:wrap;justify-content:center;gap:22px 16px;margin:26px 0 22px;min-height:200px}
.tube{width:54px;height:196px;border:3px solid #55459a;border-top:0;border-radius:0 0 28px 28px;display:flex;flex-direction:column-reverse;padding:4px 3px 3px;gap:3px;background:#ffffff08;cursor:pointer;transition:transform .15s}
.tube.sel{transform:translateY(-16px);border-color:var(--g)}
.tube.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.seg{flex:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#0006;font-weight:700}
.tube.done{border-color:var(--g)}
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9;padding:20px}
#modal .box{background:var(--panel);border:1px solid var(--a);border-radius:16px;padding:26px 30px;max-width:340px}
#modal h2{font-size:26px;margin-bottom:6px}
.tip{color:var(--mut);font-size:13px;margin-top:14px}
@media(max-width:480px){.tube{width:46px;height:176px}#board{gap:20px 12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div class="wrap">
 <h1>Rang <span>Sort</span></h1>
 <p class="sub">Har tube mein sirf ek rang rakhna hai. Tube dabao, phir doosra tube dabao.</p>
 <div class="bar"><span class="pill">Level <b id="lvl">1</b></span><span class="pill">Chalein <b id="mv">0</b></span></div>
 <div class="bar">
  <button class="btn" id="undo">↶ Wapas</button>
  <button class="btn" id="restart">⟲ Dobara</button>
  <button class="btn" id="add">＋ Extra tube</button>
 </div>
 <div id="board" role="group" aria-label="Tubes"></div>
 <p class="tip">Upar wala rang doosre tube mein tab ja sakta hai jab wo khali ho ya uska upar wala rang same ho. Har rang par nishan bhi hai taake pehchanna aasan ho.</p>
</div>
<div id="modal" hidden><div class="box"><h2>Shabash! 🎉</h2><p id="mmsg" style="margin-bottom:16px"></p><button class="btn main" id="next">Agla level →</button></div></div>
<script>
const $=id=>document.getElementById(id);
const COL=["#ef5350","#42a5f5","#66bb6a","#ffca28","#ab47bc","#ff7043","#26c6da","#ec407a","#8d6e63","#9ccc65"];
const SYM=["●","▲","■","◆","★","♥","✚","⬟","☾","✿"];
const CAP=4,KEY="rang_sort_level";
let level=1,tubes=[],start=[],hist=[],sel=null,moves=0,addUsed=false;
try{const v=parseInt(localStorage.getItem(KEY),10);if(v>0)level=v}catch(e){}
const solved=t=>t.every(x=>x.length===0||(x.length===CAP&&x.every(c=>c===x[0])));
function gen(n){
 const k=Math.min(3+Math.floor((n-1)/2),10);let t;
 do{const pool=[];for(let c=0;c<k;c++)for(let i=0;i<CAP;i++)pool.push(c);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  t=[];for(let i=0;i<k;i++)t.push(pool.slice(i*CAP,i*CAP+CAP));t.push([],[]);
 }while(t.some(x=>x.length&&x.every(c=>c===x[0])));
 return t}
function init(newLvl){
 if(newLvl)start=gen(level);tubes=start.map(x=>x.slice());hist=[];sel=null;moves=0;addUsed=false;
 try{localStorage.setItem(KEY,level)}catch(e){}
 $("modal").hidden=true;render()}
function render(){
 $("lvl").textContent=level;$("mv").textContent=moves;$("undo").disabled=!hist.length;$("add").disabled=addUsed;
 const b=$("board");b.textContent="";
 tubes.forEach((t,i)=>{const d=document.createElement("div");d.className="tube"+(sel===i?" sel":"")+(t.length===CAP&&t.every(c=>c===t[0])?" done":"");
  d.dataset.i=i;d.tabIndex=0;d.setAttribute("role","button");d.setAttribute("aria-label","Tube "+(i+1)+", "+t.length+" rang");
  t.forEach(c=>{const s=document.createElement("div");s.className="seg";s.style.background=COL[c];s.textContent=SYM[c];d.append(s)});b.append(d)})}
function move(a,b){
 const from=tubes[a],to=tubes[b];if(!from.length||to.length>=CAP)return false;
 const c=from[from.length-1];if(to.length&&to[to.length-1]!==c)return false;
 let run=0;for(let i=from.length-1;i>=0&&from[i]===c;i--)run++;
 const n=Math.min(run,CAP-to.length);
 hist.push(JSON.stringify(tubes));for(let i=0;i<n;i++)to.push(from.pop());moves++;return true}
function pick(i){
 if(sel===null){if(tubes[i].length){sel=i}render();return}
 if(sel===i){sel=null;render();return}
 const ok=move(sel,i);
 if(ok){sel=null;render();if(solved(tubes))win()}
 else{const had=tubes[i].length>0;const el=$("board").children[i];
  if(had){sel=i;render()}else{sel=null;render()}
  const e=$("board").children[i];if(e&&!had){e.classList.add("shake")}}}
function win(){$("mmsg").textContent="Level "+level+" "+moves+" chalon mein hal kar diya!";$("modal").hidden=false}
$("board").addEventListener("click",e=>{const t=e.target.closest(".tube");if(t&&$("modal").hidden)pick(+t.dataset.i)});
$("board").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const t=e.target.closest(".tube");if(t){e.preventDefault();pick(+t.dataset.i);const n=$("board").children[+t.dataset.i];if(n)n.focus()}}});
$("undo").onclick=()=>{if(!hist.length)return;tubes=JSON.parse(hist.pop());moves=Math.max(0,moves-1);sel=null;render()};
$("restart").onclick=()=>init(false);
$("add").onclick=()=>{if(addUsed)return;tubes.push([]);addUsed=true;sel=null;render()};
$("next").onclick=()=>{level++;init(true)};
init(true);
</script>
</body></html>
